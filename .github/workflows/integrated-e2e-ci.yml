name: integrated-e2e-ci

on:
  pull_request:
    paths:
      - '.github/workflows/integrated-e2e-ci.yml'
      - 'infra/integration/**'
      - 'tests/contract/**'
      - 'tests/e2e/**'
      - 'packages/contracts/**'
      - 'services/work-service/**'
      - 'services/audit-consumer/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      SUBJECT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      RUNTIME_EVIDENCE_DIR: ${{ runner.temp }}/pr5-evidence
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          ref: ${{ env.SUBJECT_SHA }}

      - name: Bind workflow to exact subject head
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          test "$actual_sha" = "$SUBJECT_SHA"
          mkdir -p "$RUNTIME_EVIDENCE_DIR"
          printf '{\n  "result": "PASS",\n  "gate": "exact-subject-head",\n  "subjectSha": "%s",\n  "checkedOutSha": "%s"\n}\n' \
            "$SUBJECT_SHA" "$actual_sha" > "$RUNTIME_EVIDENCE_DIR/subject-receipt.json"

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: |
            services/work-service/pom.xml
            services/audit-consumer/pom.xml

      - uses: actions/setup-node@v5
        with:
          node-version: '24.19.0'

      - name: Execute contract-first integrated runtime
        run: |
          chmod +x infra/integration/prepare-sources.sh infra/integration/runtime.sh
          ./infra/integration/runtime.sh run

      - name: Upload exact-head runtime receipts and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr5-runtime-${{ env.SUBJECT_SHA }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            ${{ env.RUNTIME_EVIDENCE_DIR }}/**
            .runtime/pr5/logs/**

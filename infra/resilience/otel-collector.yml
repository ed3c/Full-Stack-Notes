receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  otlp/jaeger:
    endpoint: jaeger:4317
    tls:
      insecure: true
  prometheus:
    endpoint: 0.0.0.0:9464
  file/traces:
    path: /evidence/otel-traces.json
  file/metrics:
    path: /evidence/otel-metrics.json
  file/logs:
    path: /evidence/otel-logs.json

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [otlp/jaeger, file/traces]
    metrics:
      receivers: [otlp]
      processors: [batch]
      exporters: [prometheus, file/metrics]
    logs:
      receivers: [otlp]
      processors: [batch]
      exporters: [file/logs]

name: full-stack-notes-pr6

services:
  postgres:
    image: postgres:18
    environment:
      POSTGRES_DB: workqueue
      POSTGRES_USER: workqueue
      POSTGRES_PASSWORD: workqueue
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U workqueue -d workqueue"]
      interval: 2s
      timeout: 3s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql

  kafka:
    image: apache/kafka:4.2.1
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:19092,CONTROLLER://:19093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:19092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:19093
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 1
    ports:
      - "19092:19092"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:19092 --list >/dev/null 2>&1"]
      interval: 3s
      timeout: 5s
      retries: 40

  nginx:
    image: nginx:1.28.0-alpine
    depends_on:
      - postgres
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "18081:8080"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ${PR6_EVIDENCE_DIR:-../../.runtime/pr6/evidence}:/evidence

  toxiproxy:
    image: ghcr.io/shopify/toxiproxy:2.12.0
    ports:
      - "8474:8474"
      - "18080:18080"

  jaeger:
    image: jaegertracing/jaeger:2.20.0
    ports:
      - "16686:16686"

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.159.0
    command: ["--config=/etc/otelcol/config.yml"]
    depends_on:
      - jaeger
    ports:
      - "14317:4317"
      - "14318:4318"
    volumes:
      - ./otel-collector.yml:/etc/otelcol/config.yml:ro
      - ${PR6_EVIDENCE_DIR:-../../.runtime/pr6/evidence}:/evidence

  prometheus:
    image: prom/prometheus:v3.13.2
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    depends_on:
      - otel-collector
    ports:
      - "19090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro

volumes:
  postgres-data:

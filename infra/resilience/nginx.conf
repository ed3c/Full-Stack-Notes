events {}

http {
  log_format upstream '$time_iso8601 request_id=$http_x_request_id status=$status '
                      'upstream=$upstream_addr upstream_status=$upstream_status '
                      'request_time=$request_time upstream_time=$upstream_response_time request="$request"';

  upstream work_service {
    least_conn;
    server host.docker.internal:8081 max_fails=1 fail_timeout=2s;
    server host.docker.internal:8082 max_fails=1 fail_timeout=2s;
    keepalive 16;
  }

  server {
    listen 8080;
    access_log /evidence/nginx-access.log upstream;

    location / {
      proxy_pass http://work_service;
      proxy_http_version 1.1;
      proxy_set_header Connection "";
      proxy_set_header Host $host;
      proxy_set_header X-Request-Id $http_x_request_id;
      proxy_connect_timeout 250ms;
      proxy_read_timeout 5s;
      proxy_next_upstream error timeout http_502 http_503 http_504;
      proxy_next_upstream_tries 2;
    }
  }
}

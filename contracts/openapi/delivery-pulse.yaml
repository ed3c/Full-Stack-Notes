openapi: 3.1.0
info:
  title: Delivery Pulse API
  version: 0.1.0-candidate
  description: >-
    Candidate web/domain contract for the Delivery Pulse portfolio MVP.
    Presence of this file does not prove an implementation or deployed endpoint.
servers:
  - url: http://localhost:3001
    description: Local BFF candidate
security:
  - sessionCookie: []
tags:
  - name: Initiatives
  - name: Timeline
  - name: Risk
  - name: Stream
  - name: Health

paths:
  /v1/initiatives:
    post:
      tags: [Initiatives]
      operationId: createInitiative
      summary: Create one initiative idempotently
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateInitiativeRequest'
      responses:
        '201':
          description: Initiative committed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiativeEnvelope'
        '200':
          description: Stored response for an identical idempotent retry
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiativeEnvelope'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'
    get:
      tags: [Initiatives]
      operationId: listInitiatives
      summary: List tenant initiatives with cursor pagination
      parameters:
        - name: state
          in: query
          required: false
          schema:
            $ref: '#/components/schemas/InitiativeState'
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 25
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Page of initiatives
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiativePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /v1/initiatives/{initiativeId}:
    parameters:
      - $ref: '#/components/parameters/InitiativeId'
    get:
      tags: [Initiatives]
      operationId: getInitiative
      summary: Read canonical initiative state
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Initiative state
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/InitiativeEnvelope'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/initiatives/{initiativeId}/transitions:
    parameters:
      - $ref: '#/components/parameters/InitiativeId'
    post:
      tags: [Initiatives]
      operationId: transitionInitiative
      summary: Apply one workflow transition with optimistic concurrency
      parameters:
        - $ref: '#/components/parameters/IdempotencyKey'
        - $ref: '#/components/parameters/IfMatch'
        - $ref: '#/components/parameters/Traceparent'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionInitiativeRequest'
      responses:
        '200':
          description: Transition committed
          headers:
            ETag:
              $ref: '#/components/headers/ETag'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TransitionResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '412':
          $ref: '#/components/responses/VersionConflict'
        '429':
          $ref: '#/components/responses/RateLimited'
        '503':
          $ref: '#/components/responses/Unavailable'

  /v1/initiatives/{initiativeId}/timeline:
    parameters:
      - $ref: '#/components/parameters/InitiativeId'
    get:
      tags: [Timeline]
      operationId: getInitiativeTimeline
      summary: Read the append-only transition timeline
      parameters:
        - name: cursor
          in: query
          required: false
          schema:
            type: string
            maxLength: 512
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 50
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Timeline page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TimelinePage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/initiatives/{initiativeId}/risk:
    parameters:
      - $ref: '#/components/parameters/InitiativeId'
    get:
      tags: [Risk]
      operationId: getInitiativeRisk
      summary: Read eventually consistent delivery-risk projection
      parameters:
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: Risk projection with source aggregate version
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RiskProjection'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'

  /v1/stream:
    get:
      tags: [Stream]
      operationId: streamInitiativeUpdates
      summary: Stream resumable tenant-scoped updates
      parameters:
        - name: cursor
          in: query
          required: false
          description: Last fully processed event cursor
          schema:
            type: string
            maxLength: 512
        - $ref: '#/components/parameters/Traceparent'
      responses:
        '200':
          description: >-
            text/event-stream. Events include id, event, retry and JSON data.
            The server may emit a typed reset event when the cursor is expired.
          headers:
            Cache-Control:
              schema:
                type: string
              example: no-cache
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/RateLimited'

  /health/live:
    get:
      tags: [Health]
      security: []
      operationId: getLiveness
      responses:
        '200':
          description: Process is alive
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResult'

  /health/ready:
    get:
      tags: [Health]
      security: []
      operationId: getReadiness
      responses:
        '200':
          description: Instance is eligible for user traffic
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResult'
        '503':
          description: Instance is alive but not ready
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HealthResult'

components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: delivery_pulse_session

  parameters:
    InitiativeId:
      name: initiativeId
      in: path
      required: true
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: Tenant-scoped key. Reuse with a different request hash is a conflict.
      schema:
        type: string
        minLength: 16
        maxLength: 128
        pattern: '^[A-Za-z0-9._:-]+$'
    IfMatch:
      name: If-Match
      in: header
      required: true
      description: Quoted aggregate version, for example "4".
      schema:
        type: string
        pattern: '^"[0-9]+"$'
    Traceparent:
      name: traceparent
      in: header
      required: false
      schema:
        type: string
        maxLength: 256

  headers:
    ETag:
      description: Quoted canonical aggregate version
      schema:
        type: string
        pattern: '^"[0-9]+"$'

  responses:
    ValidationError:
      description: Request failed syntactic or semantic validation
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unauthorized:
      description: No valid session
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Forbidden:
      description: Authenticated actor lacks tenant/resource permission
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    NotFound:
      description: Resource is absent or intentionally hidden
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Conflict:
      description: Idempotency payload conflict or invalid current workflow state
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    VersionConflict:
      description: If-Match does not equal the canonical aggregate version
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: '#/components/schemas/Problem'
              - type: object
                required: [currentVersion]
                properties:
                  currentVersion:
                    type: integer
                    format: int64
                    minimum: 0
                  currentState:
                    $ref: '#/components/schemas/InitiativeState'
    RateLimited:
      description: Tenant or global admission budget rejected the request
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'
    Unavailable:
      description: Dependency or overload state prevents truthful completion
      headers:
        Retry-After:
          schema:
            type: integer
            minimum: 1
      content:
        application/problem+json:
          schema:
            $ref: '#/components/schemas/Problem'

  schemas:
    InitiativeState:
      type: string
      enum: [DRAFT, READY, IN_PROGRESS, HANDOFF_PENDING, BLOCKED, DONE]

    AcceptanceConstraint:
      type: object
      additionalProperties: false
      required: [id, text, satisfied]
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          minLength: 1
          maxLength: 1000
        satisfied:
          type: boolean
        evidenceUrl:
          type: [string, 'null']
          format: uri
          maxLength: 2048

    Initiative:
      type: object
      additionalProperties: false
      required:
        - id
        - title
        - description
        - state
        - version
        - acceptanceConstraints
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        state:
          $ref: '#/components/schemas/InitiativeState'
        version:
          type: integer
          format: int64
          minimum: 0
        handoffOwnerId:
          type: [string, 'null']
          format: uuid
        dueAt:
          type: [string, 'null']
          format: date-time
        acceptanceConstraints:
          type: array
          maxItems: 50
          items:
            $ref: '#/components/schemas/AcceptanceConstraint'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time

    InitiativeEnvelope:
      type: object
      additionalProperties: false
      required: [initiative, traceId]
      properties:
        initiative:
          $ref: '#/components/schemas/Initiative'
        traceId:
          type: string
          minLength: 16
          maxLength: 64

    CreateInitiativeRequest:
      type: object
      additionalProperties: false
      required: [title, description, acceptanceConstraints]
      properties:
        title:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          maxLength: 10000
        acceptanceConstraints:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [text]
            properties:
              text:
                type: string
                minLength: 1
                maxLength: 1000
        handoffOwnerId:
          type: [string, 'null']
          format: uuid
        dueAt:
          type: [string, 'null']
          format: date-time

    TransitionInitiativeRequest:
      type: object
      additionalProperties: false
      required: [toState, reason]
      properties:
        toState:
          $ref: '#/components/schemas/InitiativeState'
        reason:
          type: string
          minLength: 1
          maxLength: 2000
        handoffOwnerId:
          type: [string, 'null']
          format: uuid
        dueAt:
          type: [string, 'null']
          format: date-time
        satisfiedConstraintIds:
          type: array
          maxItems: 50
          uniqueItems: true
          items:
            type: string
            format: uuid

    TransitionResult:
      type: object
      additionalProperties: false
      required: [initiative, transitionId, eventId, traceId]
      properties:
        initiative:
          $ref: '#/components/schemas/Initiative'
        transitionId:
          type: string
          format: uuid
        eventId:
          type: string
          format: uuid
        traceId:
          type: string
          minLength: 16
          maxLength: 64

    TimelineEntry:
      type: object
      additionalProperties: false
      required: [id, fromState, toState, actorId, reason, aggregateVersion, occurredAt, traceId]
      properties:
        id:
          type: string
          format: uuid
        fromState:
          type: [string, 'null']
        toState:
          $ref: '#/components/schemas/InitiativeState'
        actorId:
          type: string
          format: uuid
        reason:
          type: string
        aggregateVersion:
          type: integer
          format: int64
        occurredAt:
          type: string
          format: date-time
        traceId:
          type: string

    InitiativePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Initiative'
        nextCursor:
          type: [string, 'null']

    TimelinePage:
      type: object
      additionalProperties: false
      required: [items, nextCursor]
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/TimelineEntry'
        nextCursor:
          type: [string, 'null']

    RiskProjection:
      type: object
      additionalProperties: false
      required: [initiativeId, riskLevel, reasons, sourceVersion, calculatedAt, stale]
      properties:
        initiativeId:
          type: string
          format: uuid
        riskLevel:
          type: string
          enum: [UNKNOWN, LOW, MEDIUM, HIGH, CRITICAL]
        reasons:
          type: array
          maxItems: 20
          items:
            type: string
            maxLength: 500
        sourceVersion:
          type: integer
          format: int64
          minimum: 0
        calculatedAt:
          type: string
          format: date-time
        stale:
          type: boolean

    HealthResult:
      type: object
      additionalProperties: false
      required: [status]
      properties:
        status:
          type: string
          enum: [UP, DOWN, DEGRADED]
        checks:
          type: object
          additionalProperties:
            type: string

    Problem:
      type: object
      additionalProperties: false
      required: [type, title, status, code, traceId]
      properties:
        type:
          type: string
          format: uri
        title:
          type: string
        status:
          type: integer
          minimum: 400
          maximum: 599
        code:
          type: string
          pattern: '^[A-Z0-9_]+$'
        detail:
          type: [string, 'null']
          maxLength: 2000
        traceId:
          type: string
          minLength: 16
          maxLength: 64
        fieldErrors:
          type: array
          maxItems: 50
          items:
            type: object
            additionalProperties: false
            required: [field, code]
            properties:
              field:
                type: string
              code:
                type: string

server:
  port: ${PORT:8080}
  shutdown: graceful

spring:
  application:
    name: work-service
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/workqueue}
    username: ${DATABASE_USER:workqueue}
    password: ${DATABASE_PASSWORD:workqueue}
    hikari:
      maximum-pool-size: ${DB_POOL_MAX_SIZE:10}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:2000}
  flyway:
    enabled: true

logging:
  pattern:
    level: "%5p [request_id=%X{requestId:-}]"
